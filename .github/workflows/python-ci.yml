name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install "uv==0.12.1"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check src tests

      - name: mypy
        run: uv run mypy src

      - name: pytest
        run: uv run pytest -q
