[project]
name = "ecobiome"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MMAAXXIII", email = "160916593+MMAAXXIII@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "requests>=2.34.2",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
ecobiome = "ecobiome.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
